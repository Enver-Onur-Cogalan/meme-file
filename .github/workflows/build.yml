name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Sürüm etiketi package.json ile aynı mı
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Etiket $GITHUB_REF_NAME ama package.json sürümü $expected" && exit 1
          fi

      - name: Kurulum dosyası
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --publish never

      # Etiketli sürümler GitHub Releases'a yüklenir; kurulu uygulamalar buradan güncellenir.
      # Önce tek bir taslak sürüm açılır: electron-builder dosyaları paralel yüklerken
      # sürüm yoksa aynı etiket için birden fazla sürüm oluşturabiliyor.
      - name: Taslak sürüm oluştur
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Meme File ${GITHUB_REF_NAME#v}" \
            --notes "Kurulum: \`MemeFile-${GITHUB_REF_NAME#v}-setup.exe\` dosyasını indir. Kod imzasız olduğu için Windows SmartScreen uyarı verir: **Ek bilgi → Yine de çalıştır**. Denemek için [test rehberi](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/TEST-REHBERI.md)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dosyaları yükle
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '[.assets[].name] | join(" ")')
          echo "Yüklenenler: $assets"
          for required in latest.yml "MemeFile-${GITHUB_REF_NAME#v}-setup.exe"; do
            [[ " $assets " == *" $required "* ]] || { echo "Eksik: $required"; exit 1; }
          done
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Güncelleme yapılandırması pakette mi
        shell: bash
        run: test -f dist/win-unpacked/resources/app-update.yml && cat dist/win-unpacked/resources/app-update.yml

      - uses: actions/upload-artifact@v4
        with:
          name: MemeFile-windows
          path: dist/*-setup.exe
          if-no-files-found: error
